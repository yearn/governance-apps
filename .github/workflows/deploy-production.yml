name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or commit SHA) to deploy to production
        required: false
        default: master
        type: string

jobs:
  deploy:
    name: Build And Deploy Production Worker
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Dependency Policy
        run: npm run validate:deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit And Integration Tests
        run: npm test

      - name: Validate Production Env Invariants
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: production
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_YETH: "true"
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_GLOBAL_DATA_URL: ${{ vars.NEXT_PUBLIC_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_MOTD_URL: ${{ vars.NEXT_PUBLIC_MOTD_URL }}
          NEXT_PUBLIC_RPC_URLS: ${{ vars.NEXT_PUBLIC_RPC_URLS }}
        run: npm run validate:prod-env

      - name: Build OpenNext Worker
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: production
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_YETH: "true"
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_GLOBAL_DATA_URL: ${{ vars.NEXT_PUBLIC_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_MOTD_URL: ${{ vars.NEXT_PUBLIC_MOTD_URL }}
          NEXT_PUBLIC_RPC_URLS: ${{ vars.NEXT_PUBLIC_RPC_URLS }}
        run: npm run worker:build

      - name: Deploy To Cloudflare Production
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: production
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_YETH: "true"
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_GLOBAL_DATA_URL: ${{ vars.NEXT_PUBLIC_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_MOTD_URL: ${{ vars.NEXT_PUBLIC_MOTD_URL }}
          NEXT_PUBLIC_RPC_URLS: ${{ vars.NEXT_PUBLIC_RPC_URLS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run worker:deploy:prod
